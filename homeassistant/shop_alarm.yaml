# Shop alarm package
#
# Deployment target on Home Assistant OS:
#   /config/packages/shop_alarm.yaml
#
# The alarm can be triggered by either the real front door or a dedicated
# test helper. The test helper lets pytest exercise the same alarm logic
# without anyone physically opening the shop door.

input_boolean:
  shop_alarm_armed:
    name: Shop Alarm Armed
    icon: mdi:shield-lock

  shop_alarm_triggered:
    name: Shop Alarm Triggered
    initial: false
    icon: mdi:alarm-light

  shop_alarm_test_door_open:
    name: Shop Alarm Test Door Open
    initial: false
    icon: mdi:door-open

automation:
  - id: shop_alarm_front_door_trigger
    alias: "Shop Alarm - Door Trigger"
    description: "Trigger the shop alarm when the real or test door opens while armed."
    triggers:
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        to: "on"
      - trigger: state
        entity_id: input_boolean.shop_alarm_test_door_open
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.shop_alarm_armed
        state: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_alarm_triggered
    mode: single

  - id: shop_alarm_disarm_clears_trigger
    alias: "Shop Alarm - Disarm Clears Trigger"
    description: "Clear an active alarm whenever the shop alarm is disarmed."
    triggers:
      - trigger: state
        entity_id: input_boolean.shop_alarm_armed
        to: "off"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_triggered
    mode: single
