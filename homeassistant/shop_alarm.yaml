# Shop alarm package
#
# Deployment target on Home Assistant OS:
#   /config/packages/shop_alarm.yaml
#
# Alarm mode is status/target information written by the command scripts.
# It is NOT an arming command and should not be changed directly by the UI.
#   Disarmed - no door alarm
#   Home     - front door is protected; opening it starts Entry Delay
#   Away     - front door is protected after an exit delay
#   Sleep    - front door is protected after an exit delay
#
# Alarm state tracks the Ring-style progression:
#   Disarmed -> Exit Delay -> Armed Away -> Entry Delay -> Alarm
#
# Arming fault handling:
#   Home, Away, and Sleep refuse normal arming when a critical system trouble
#   exists. Away and Sleep also refuse normal arming when the protected front
#   door is open. A one-cycle fault override allows the operator to arm anyway
#   after the fault is clearly displayed. Exit Delay can be cancelled without
#   a PIN because the system has not armed yet.
#
# Pytest can enable test mode to shorten delays to one second. Test mode
# also suppresses phone notifications so automated tests do not make noise.

# Native Home Assistant alarm panel.
# The PIN is stored separately in /config/secrets.yaml as shop_alarm_pin.
# The keypad is synchronized for status/disarming only; dashboard scripts initiate arming.
# Existing alarm logic remains authoritative for delays, faults, siren,
# water alarm, and system trouble.
alarm_control_panel:
  - platform: manual
    name: Shop Alarm Keypad
    unique_id: shop_alarm_keypad
    code: !secret shop_alarm_pin
    code_arm_required: false
    arming_time: 0
    delay_time: 0
    trigger_time: 0
    arming_states:
      - armed_home
      - armed_away
      - armed_night

input_select:
  shop_alarm_mode:
    name: Shop Alarm Mode
    options:
      - Disarmed
      - Home
      - Away
      - Sleep
    initial: Disarmed
    icon: mdi:shield-home

  shop_alarm_state:
    name: Shop Alarm State
    options:
      - Disarmed
      - Armed Home
      - Exit Delay
      - Armed Away
      - Armed Sleep
      - Entry Delay
      - Fault
      - Alarm
    initial: Disarmed
    icon: mdi:shield-lock

input_boolean:
  shop_alarm_triggered:
    name: Shop Alarm Triggered
    initial: false
    icon: mdi:alarm-light

  shop_alarm_test_door_open:
    name: Shop Alarm Test Door Open
    initial: false
    icon: mdi:door-open

  shop_alarm_test_mode:
    name: Shop Alarm Test Mode
    initial: false
    icon: mdi:test-tube

  shop_alarm_test_siren_unavailable:
    name: Shop Alarm Test Siren Unavailable
    initial: false
    icon: mdi:test-tube

  shop_alarm_test_front_door_unavailable:
    name: Shop Alarm Test Front Door Unavailable
    initial: false
    icon: mdi:test-tube

  shop_alarm_fault_override:
    name: Shop Alarm Fault Override
    initial: false
    icon: mdi:shield-alert

  # Retained for compatibility with the existing pytest suite and old UI.
  # New UI controls use shop_alarm_fault_override instead.
  shop_alarm_away_override:
    name: Shop Alarm Away Override
    initial: false
    icon: mdi:shield-alert

  shop_alarm_keypad_sync:
    name: Shop Alarm Keypad Sync
    initial: false
    icon: mdi:sync

  shop_water_alarm_enabled:
    name: Shop Water Alarm Enabled
    initial: true
    icon: mdi:water-alert

  shop_water_alarm_active:
    name: Shop Water Alarm Active
    initial: false
    icon: mdi:water-alert

  shop_water_alarm_test_wet:
    name: Shop Water Alarm Test Wet
    initial: false
    icon: mdi:test-tube

template:
  - binary_sensor:
      - name: Shop Alarm System Trouble
        unique_id: shop_alarm_system_trouble
        device_class: problem
        state: >-
          {{ states('switch.shop_siren_relay') in ['unavailable', 'unknown']
             or states('binary_sensor.shop_front_door_opening') in ['unavailable', 'unknown']
             or is_state('input_boolean.shop_alarm_test_siren_unavailable', 'on')
             or is_state('input_boolean.shop_alarm_test_front_door_unavailable', 'on') }}
        attributes:
          trouble_reason: >-
            {% set siren = states('switch.shop_siren_relay') %}
            {% set door = states('binary_sensor.shop_front_door_opening') %}
            {% set test_siren = is_state('input_boolean.shop_alarm_test_siren_unavailable', 'on') %}
            {% set test_door = is_state('input_boolean.shop_alarm_test_front_door_unavailable', 'on') %}
            {% if test_siren and test_door %}
              TEST: siren relay unavailable; front door sensor unavailable
            {% elif test_siren %}
              TEST: siren relay unavailable
            {% elif test_door %}
              TEST: front door sensor unavailable
            {% elif siren in ['unavailable', 'unknown'] and door in ['unavailable', 'unknown'] %}
              Siren relay {{ siren }}; front door sensor {{ door }}
            {% elif siren == 'unavailable' %}
              Siren relay unavailable
            {% elif siren == 'unknown' %}
              Siren relay state unknown
            {% elif door == 'unavailable' %}
              Front door sensor unavailable
            {% elif door == 'unknown' %}
              Front door sensor state unknown
            {% else %}
              None
            {% endif %}

  - binary_sensor:
      - name: Shop Alarm Home Ready
        unique_id: shop_alarm_home_ready
        device_class: running
        state: >-
          {{ is_state('binary_sensor.shop_alarm_system_trouble', 'off') }}
        attributes:
          fault_reason: >-
            {% if is_state('binary_sensor.shop_alarm_system_trouble', 'on') %}
              {{ state_attr('binary_sensor.shop_alarm_system_trouble', 'trouble_reason') }}
            {% else %}
              None
            {% endif %}

      - name: Shop Alarm Away Ready
        unique_id: shop_alarm_away_ready
        device_class: running
        state: >-
          {{ is_state('binary_sensor.shop_alarm_system_trouble', 'off')
             and is_state('binary_sensor.shop_front_door_opening', 'off')
             and is_state('input_boolean.shop_alarm_test_door_open', 'off') }}
        attributes:
          fault_reason: >-
            {% set reasons = [] %}
            {% if is_state('binary_sensor.shop_front_door_opening', 'on')
                  or is_state('input_boolean.shop_alarm_test_door_open', 'on') %}
              {% set reasons = reasons + ['Front door is open'] %}
            {% endif %}
            {% if is_state('binary_sensor.shop_alarm_system_trouble', 'on') %}
              {% set reasons = reasons + [state_attr('binary_sensor.shop_alarm_system_trouble', 'trouble_reason')] %}
            {% endif %}
            {{ reasons | join('; ') if reasons else 'None' }}

      - name: Shop Alarm Sleep Ready
        unique_id: shop_alarm_sleep_ready
        device_class: running
        state: >-
          {{ is_state('binary_sensor.shop_alarm_system_trouble', 'off')
             and is_state('binary_sensor.shop_front_door_opening', 'off')
             and is_state('input_boolean.shop_alarm_test_door_open', 'off') }}
        attributes:
          fault_reason: >-
            {% set reasons = [] %}
            {% if is_state('binary_sensor.shop_front_door_opening', 'on')
                  or is_state('input_boolean.shop_alarm_test_door_open', 'on') %}
              {% set reasons = reasons + ['Front door is open'] %}
            {% endif %}
            {% if is_state('binary_sensor.shop_alarm_system_trouble', 'on') %}
              {% set reasons = reasons + [state_attr('binary_sensor.shop_alarm_system_trouble', 'trouble_reason')] %}
            {% endif %}
            {{ reasons | join('; ') if reasons else 'None' }}

input_text:
  shop_alarm_notify_action:
    name: Shop Alarm Notify Action
    max: 255
    icon: mdi:cellphone-message

script:
  shop_alarm_send_notification:
    alias: "Shop Alarm - Send Notification"
    description: "Send an audible mobile-app notification when a phone notify action is configured."
    fields:
      title:
        description: "Notification title"
      message:
        description: "Notification message"
    sequence:
      - condition: state
        entity_id: input_boolean.shop_alarm_test_mode
        state: "off"
      - condition: template
        value_template: >-
          {{ states('input_text.shop_alarm_notify_action').startswith('notify.mobile_app_') }}
      - action: "{{ states('input_text.shop_alarm_notify_action') }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            push:
              sound: default
    mode: parallel
    max: 10

  # ---------------------------------------------------------------------------
  # Alarm command API
  #
  # Dashboard cards and tests call the small request/override wrappers below.
  # They all funnel into shop_alarm_arm, which is the single authority for
  # arming transitions.  Changing input_select.shop_alarm_mode by itself does
  # NOT arm or disarm the system.
  # ---------------------------------------------------------------------------

  shop_alarm_set_status:
    alias: "Shop Alarm - Set Status"
    description: "Internal helper: update the displayed target mode and actual alarm state together."
    fields:
      mode:
        description: "Disarmed, Home, Away, or Sleep"
      state:
        description: "Actual Shop Alarm State"
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: "{{ state }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_mode
        data:
          option: "{{ mode }}"
    mode: queued
    max: 10

  shop_alarm_arm:
    alias: "Shop Alarm - Arm"
    description: "Single authoritative arming routine for Home, Away, and Sleep."
    fields:
      requested_mode:
        description: "Home, Away, or Sleep"
      override_fault:
        description: "Allow this one arming cycle despite current readiness faults."
    sequence:
      - variables:
          mode_requested: "{{ requested_mode }}"
          override_requested: "{{ override_fault | default(false) | bool }}"
          current_state: "{{ states('input_select.shop_alarm_state') }}"
          fault_reason: >-
            {% set reasons = [] %}
            {% if requested_mode in ['Away', 'Sleep']
                  and (
                    is_state('binary_sensor.shop_front_door_opening', 'on')
                    or is_state('input_boolean.shop_alarm_test_door_open', 'on')
                  ) %}
              {% set reasons = reasons + ['Front door is open'] %}
            {% endif %}
            {% if is_state('binary_sensor.shop_alarm_system_trouble', 'on') %}
              {% set reasons = reasons + [state_attr('binary_sensor.shop_alarm_system_trouble', 'trouble_reason')] %}
            {% endif %}
            {{ reasons | join('; ') }}

      - if:
          - condition: template
            value_template: "{{ mode_requested not in ['Home', 'Away', 'Sleep'] }}"
        then:
          - stop: "Invalid shop alarm mode request"

      # Only a disarmed system may begin a new arming cycle.
      - if:
          - condition: template
            value_template: "{{ current_state != 'Disarmed' }}"
        then:
          - action: script.shop_alarm_send_notification
            data:
              title: "Shop alarm"
              message: "Arm {{ mode_requested }} ignored because the system is {{ current_state }}."
          - stop: "Arming request rejected because system is not Disarmed"

      # A normal request with a readiness fault leaves the system truly
      # Disarmed/Disarmed.  The explicit OVERRIDE FAULT buttons call this same
      # routine with override_fault=true.
      - if:
          - condition: template
            value_template: "{{ fault_reason | trim != '' and not override_requested }}"
        then:
          - action: script.shop_alarm_set_status
            data:
              mode: Disarmed
              state: Disarmed
          - action: script.shop_alarm_send_notification
            data:
              title: "Shop alarm cannot arm normally"
              message: >-
                {{ mode_requested }}: {{ fault_reason }}.
                Correct the problem or use {{ mode_requested | upper }} - OVERRIDE FAULT.
          - stop: "Arming blocked by readiness fault"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_triggered

      # Arming never commands the siren relay.  A relay that disappears after
      # the pre-arm check therefore cannot abort the state-machine transition.
      # Relay commands are reserved for actual alarm/silence operations and
      # use continue_on_error there.

      - if:
          - condition: template
            value_template: "{{ mode_requested == 'Home' }}"
        then:
          - action: script.shop_alarm_set_status
            data:
              mode: Home
              state: Armed Home
          - if:
              - condition: template
                value_template: "{{ override_requested }}"
            then:
              - action: script.shop_alarm_send_notification
                data:
                  title: "SHOP ALARM OVERRIDE"
                  message: >-
                    Home arming override accepted.
                    Fault: {{ fault_reason if fault_reason | trim != '' else 'fault was manually overridden' }}.
          - stop: "Home armed"

      # Away and Sleep share the same exit-delay path.
      - action: script.shop_alarm_set_status
        data:
          mode: "{{ mode_requested }}"
          state: Exit Delay

      - if:
          - condition: template
            value_template: "{{ override_requested }}"
        then:
          - action: script.shop_alarm_send_notification
            data:
              title: "SHOP ALARM OVERRIDE"
              message: >-
                {{ mode_requested }} arming override accepted.
                Fault: {{ fault_reason if fault_reason | trim != '' else 'fault was manually overridden' }}.

      - action: script.shop_alarm_send_notification
        data:
          title: "Shop alarm"
          message: "{{ mode_requested }} selected. Exit delay started."

      - delay:
          seconds: >-
            {{ 1 if is_state('input_boolean.shop_alarm_test_mode', 'on') else 30 }}

      # Cancellation/disarming changes the state away from Exit Delay, so this
      # check safely terminates the pending arming cycle.
      - condition: state
        entity_id: input_select.shop_alarm_state
        state: "Exit Delay"

      - if:
          - condition: template
            value_template: "{{ mode_requested == 'Away' }}"
        then:
          - action: script.shop_alarm_set_status
            data:
              mode: Away
              state: Armed Away
        else:
          - action: script.shop_alarm_set_status
            data:
              mode: Sleep
              state: Armed Sleep
    mode: parallel
    max: 4

  shop_alarm_disarm:
    alias: "Shop Alarm - Disarm"
    description: "Authoritative burglary-alarm disarm routine. PIN authorization is handled by the caller/keypad."
    sequence:
      # State/mode are changed first so a slow or failed relay command can
      # never prevent the logical alarm from disarming.
      - action: script.shop_alarm_set_status
        data:
          mode: Disarmed
          state: Disarmed
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_triggered

      # Do not silence an independent active water alarm.
      - if:
          - condition: state
            entity_id: input_boolean.shop_water_alarm_active
            state: "off"
        then:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: switch.shop_siren_relay
    mode: restart

  shop_alarm_request_home:
    alias: "Shop Alarm - Request Home"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Home
          override_fault: false
    mode: restart

  shop_alarm_request_away:
    alias: "Shop Alarm - Request Away"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Away
          override_fault: false
    mode: restart

  shop_alarm_request_sleep:
    alias: "Shop Alarm - Request Sleep"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Sleep
          override_fault: false
    mode: restart

  shop_alarm_override_home:
    alias: "Shop Alarm - Home Override Fault"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Home
          override_fault: true
    mode: restart

  shop_alarm_override_away:
    alias: "Shop Alarm - Away Override Fault"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Away
          override_fault: true
    mode: restart

  shop_alarm_override_sleep:
    alias: "Shop Alarm - Sleep Override Fault"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Sleep
          override_fault: true
    mode: restart

  shop_alarm_cancel_exit_delay:
    alias: "Shop Alarm - Cancel Exit Delay"
    description: "Cancel Exit Delay and return to Disarmed without requiring a PIN."
    sequence:
      - condition: state
        entity_id: input_select.shop_alarm_state
        state: "Exit Delay"
      - action: script.shop_alarm_disarm
    mode: restart

  # Compatibility name retained for older tests/UI.  It now uses the same
  # authoritative arming routine rather than manipulating helper booleans.
  shop_alarm_arm_away_anyway:
    alias: "Shop Alarm - Arm Away Anyway"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Away
          override_fault: true
    mode: restart

  shop_water_alarm_enable:
    alias: "Shop Water Alarm - Enable"
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_water_alarm_enabled
      - if:
          - condition: template
            value_template: >-
              {{ is_state('binary_sensor.water_detector', 'on')
                 or is_state('input_boolean.shop_water_alarm_test_wet', 'on') }}
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.shop_water_alarm_active
          - action: switch.turn_on
            continue_on_error: true
            target:
              entity_id: switch.shop_siren_relay
          - action: script.shop_alarm_send_notification
            data:
              title: "SHOP WATER ALARM"
              message: "Water alarm enabled while the water sensor is active."

  shop_water_alarm_disable:
    alias: "Shop Water Alarm - Disable"
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.shop_water_alarm_enabled
            - input_boolean.shop_water_alarm_active
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.shop_siren_relay


  shop_water_alarm_reset:
    alias: "Shop Water Alarm - Reset"
    description: "Clear a latched water alarm only after both real and virtual water inputs are dry."
    sequence:
      - condition: template
        value_template: >-
          {{ is_state('binary_sensor.water_detector', 'off')
             and is_state('input_boolean.shop_water_alarm_test_wet', 'off') }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_water_alarm_active
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.shop_siren_relay
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop water alarm reset"
          message: "Water alarm was reset after the sensor returned to dry."
    mode: single


automation:
  - id: shop_alarm_keypad_to_mode
    alias: "Shop Alarm - Keypad Disarm"
    description: "The keypad may disarm the system; dashboard buttons are the only arming commands."
    triggers:
      - trigger: state
        entity_id: alarm_control_panel.shop_alarm_keypad
        to: "disarmed"
    conditions:
      - condition: state
        entity_id: input_boolean.shop_alarm_keypad_sync
        state: "off"
      - condition: template
        value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Disarmed') or not is_state('input_select.shop_alarm_state', 'Disarmed') }}"
    actions:
      - action: script.shop_alarm_disarm
    mode: restart

  - id: shop_alarm_state_to_keypad
    alias: "Shop Alarm - State To Keypad"
    description: "Make the native keypad display follow the authoritative shop alarm state, not merely the requested mode."
    triggers:
      - trigger: state
        entity_id: input_select.shop_alarm_state
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Disarmed"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'disarmed') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_disarm
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
                data:
                  code: !secret shop_alarm_pin
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Home"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'armed_home') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_arm_home
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Away"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'armed_away') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_arm_away
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Sleep"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'armed_night') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_arm_night
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Fault"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'disarmed') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_disarm
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
                data:
                  code: !secret shop_alarm_pin
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
    mode: restart

  - id: shop_alarm_mode_guard
    alias: "Shop Alarm - Mode Guard"
    description: "Keep the mode helper as status only; reject direct mode edits in stable alarm states."
    triggers:
      - trigger: state
        entity_id: input_select.shop_alarm_mode
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Disarmed"
              - condition: template
                value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Disarmed') }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.shop_alarm_mode
                data:
                  option: Disarmed

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Home"
              - condition: template
                value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Home') }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.shop_alarm_mode
                data:
                  option: Home

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Away"
              - condition: template
                value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Away') }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.shop_alarm_mode
                data:
                  option: Away

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Sleep"
              - condition: template
                value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Sleep') }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.shop_alarm_mode
                data:
                  option: Sleep
    mode: restart

  - id: shop_alarm_door_entry_delay
    alias: "Shop Alarm - Door Entry Delay"
    description: "Start entry delay when the real or virtual door opens while protected."
    triggers:
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        to: "on"
      - trigger: state
        entity_id: input_boolean.shop_alarm_test_door_open
        to: "on"
    conditions:
      - condition: template
        value_template: >-
          {{ states('input_select.shop_alarm_state') in ['Armed Home', 'Armed Away', 'Armed Sleep'] }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Entry Delay
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop alarm entry delay"
          message: "Protected door opened. Disarm the shop alarm."
      - delay:
          seconds: >-
            {{ 1 if is_state('input_boolean.shop_alarm_test_mode', 'on') else 30 }}
      - condition: state
        entity_id: input_select.shop_alarm_state
        state: "Entry Delay"
      # The automation could only start from an armed state, so
      # once Entry Delay expires we do not consult the mutable mode helper.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_alarm_triggered
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Alarm
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.shop_siren_relay
      - action: script.shop_alarm_send_notification
        data:
          title: "SHOP ALARM"
          message: "Alarm triggered at the shop."
    mode: restart

  - id: shop_alarm_siren_trouble_notification
    alias: "Shop Alarm - Siren Trouble Notification"
    description: "Report when the siren relay becomes unavailable or its state becomes unknown."
    triggers:
      - trigger: state
        entity_id: switch.shop_siren_relay
        to: "unavailable"
      - trigger: state
        entity_id: switch.shop_siren_relay
        to: "unknown"
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "SHOP ALARM TROUBLE"
          message: >-
            Siren relay is {{ states('switch.shop_siren_relay') }}.
            The alarm system may be unable to sound the siren.
    mode: restart

  - id: shop_alarm_siren_trouble_restored
    alias: "Shop Alarm - Siren Trouble Restored"
    description: "Report when the siren relay returns after a trouble condition."
    triggers:
      - trigger: state
        entity_id: switch.shop_siren_relay
        from: "unavailable"
      - trigger: state
        entity_id: switch.shop_siren_relay
        from: "unknown"
    conditions:
      - condition: template
        value_template: >-
          {{ states('switch.shop_siren_relay') in ['on', 'off'] }}
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop alarm trouble cleared"
          message: "Siren relay is available again."
    mode: restart

  - id: shop_alarm_front_door_trouble_notification
    alias: "Shop Alarm - Front Door Trouble Notification"
    description: "Report when the front door sensor becomes unavailable or its state becomes unknown."
    triggers:
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        to: "unavailable"
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        to: "unknown"
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "SHOP ALARM TROUBLE"
          message: >-
            Front door sensor is {{ states('binary_sensor.shop_front_door_opening') }}.
            The alarm system may be unable to detect the front door opening.
    mode: restart

  - id: shop_alarm_front_door_trouble_restored
    alias: "Shop Alarm - Front Door Trouble Restored"
    description: "Report when the front door sensor returns after a trouble condition."
    triggers:
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        from: "unavailable"
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        from: "unknown"
    conditions:
      - condition: template
        value_template: >-
          {{ states('binary_sensor.shop_front_door_opening') in ['on', 'off'] }}
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop alarm trouble cleared"
          message: "Front door sensor is available again."
    mode: restart

  - id: shop_water_alarm_trigger
    alias: "Shop Water Alarm - Trigger"
    description: "Trigger immediately when water contact closes while the water alarm is enabled."
    triggers:
      - trigger: state
        entity_id: binary_sensor.water_detector
        to: "on"
      - trigger: state
        entity_id: input_boolean.shop_water_alarm_test_wet
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.shop_water_alarm_enabled
        state: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_water_alarm_active
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.shop_siren_relay
      - action: script.shop_alarm_send_notification
        data:
          title: "SHOP WATER ALARM"
          message: "Water detected at the shop."
    mode: restart

  - id: shop_water_alarm_sensor_dry
    alias: "Shop Water Alarm - Sensor Dry"
    description: "Report that the sensor is dry, but keep an active water alarm latched until reset."
    triggers:
      - trigger: state
        entity_id: binary_sensor.water_detector
        to: "off"
      - trigger: state
        entity_id: input_boolean.shop_water_alarm_test_wet
        to: "off"
    conditions:
      - condition: template
        value_template: >-
          {{ is_state('binary_sensor.water_detector', 'off')
             and is_state('input_boolean.shop_water_alarm_test_wet', 'off') }}
      - condition: state
        entity_id: input_boolean.shop_water_alarm_active
        state: "on"
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop water sensor dry"
          message: "Water sensor returned to dry. Water alarm remains latched until reset."
    mode: restart

