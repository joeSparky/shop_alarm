# Alarm package
#
# Deployment target on Home Assistant OS:
#   /config/packages/shop_alarm.yaml
#
# Alarm mode is status/target information written by the command scripts.
# It is NOT an arming command and should not be changed directly by the UI.
#   Disarmed - no door alarm
#   Home     - security-role sensors are protected
#   Away     - security-role sensors are protected after an exit delay
#   Sleep    - security-role sensors are protected after an exit delay
#
# Alarm state tracks the Ring-style progression:
#   Disarmed -> Exit Delay -> Armed Away -> Entry Delay -> Alarm
#
# Arming fault handling:
#   Home, Away, and Sleep refuse normal arming when a critical system trouble
#   exists. Away and Sleep also refuse normal arming when any security-role
#   sensor is active. A one-cycle fault override allows the operator to arm anyway
#   after the fault is clearly displayed. Exit Delay can be cancelled without
#   a PIN because the system has not armed yet.
#
# Pytest can enable test mode to shorten delays to one second. Test mode
# also suppresses phone notifications so automated tests do not make noise.

# Native Home Assistant alarm panel.
# The PIN is stored separately in /config/secrets.yaml as shop_alarm_pin.
# The keypad is synchronized for status/disarming only; dashboard scripts initiate arming.
# Existing alarm logic remains authoritative for delays, faults, siren,
# Notification-role sensors and system trouble.
alarm_control_panel:
  - platform: manual
    name: Alarm Keypad
    unique_id: shop_alarm_keypad
    code: !secret shop_alarm_pin
    code_arm_required: false
    arming_time: 0
    delay_time: 0
    trigger_time: 0
    arming_states:
      - armed_home
      - armed_away
      - armed_night

input_select:
  shop_alarm_mode:
    name: Alarm Mode
    options:
      - Disarmed
      - Home
      - Away
      - Sleep
    initial: Disarmed
    icon: mdi:shield-home

  shop_alarm_state:
    name: Alarm State
    options:
      - Disarmed
      - Armed Home
      - Exit Delay
      - Armed Away
      - Armed Sleep
      - Entry Delay
      - Fault
      - Alarm
    initial: Disarmed
    icon: mdi:shield-lock

input_boolean:
  shop_alarm_triggered:
    name: Alarm Triggered
    initial: false
    icon: mdi:alarm-light

  shop_alarm_notification_active:
    name: Alarm Notification Active
    initial: false
    icon: mdi:bell-alert

  shop_alarm_notifications_acknowledged:
    name: Alarm Notifications Acknowledged
    initial: false
    icon: mdi:message-check

  shop_alarm_test_door_open:
    name: Alarm Test Door Open
    initial: false
    icon: mdi:door-open

  shop_alarm_test_mode:
    name: Alarm Test Mode
    initial: false
    icon: mdi:test-tube

  shop_alarm_test_siren_unavailable:
    name: Alarm Test Siren Unavailable
    initial: false
    icon: mdi:test-tube

  shop_alarm_test_security_sensor_unavailable:
    name: Alarm Test Security Sensor Unavailable
    initial: false
    icon: mdi:test-tube

  shop_alarm_fault_override:
    name: Alarm Fault Override
    initial: false
    icon: mdi:shield-alert

  # Retained for compatibility with the existing pytest suite and old UI.
  # New UI controls use shop_alarm_fault_override instead.
  shop_alarm_away_override:
    name: Alarm Away Override
    initial: false
    icon: mdi:shield-alert

  shop_alarm_keypad_sync:
    name: Alarm Keypad Sync
    initial: false
    icon: mdi:sync

template:
  - binary_sensor:
      - name: Alarm System Trouble
        unique_id: shop_alarm_system_trouble
        device_class: problem
        state: >-
          {% set ns = namespace(trouble=false) %}
          {% if states('switch.shop_siren_relay') in ['unavailable', 'unknown']
                or is_state('input_boolean.shop_alarm_test_siren_unavailable', 'on')
                or is_state('input_boolean.shop_alarm_test_security_sensor_unavailable', 'on') %}
            {% set ns.trouble = true %}
          {% endif %}
          {% for entity in states %}
            {% set entity_labels = labels(entity.entity_id) %}
            {% if (label_id('Delayed Security') in entity_labels
                   or label_id('Immediate Security') in entity_labels)
                  and entity.state in ['unavailable', 'unknown'] %}
              {% set ns.trouble = true %}
            {% endif %}
          {% endfor %}
          {{ ns.trouble }}
        attributes:
          trouble_reason: >-
            {% set ns = namespace(reasons=[]) %}
            {% set siren = states('switch.shop_siren_relay') %}
            {% if is_state('input_boolean.shop_alarm_test_siren_unavailable', 'on') %}
              {% set ns.reasons = ns.reasons + ['TEST: siren relay unavailable'] %}
            {% elif siren in ['unavailable', 'unknown'] %}
              {% set ns.reasons = ns.reasons + ['Siren relay ' ~ siren] %}
            {% endif %}
            {% if is_state('input_boolean.shop_alarm_test_security_sensor_unavailable', 'on') %}
              {% set ns.reasons = ns.reasons + ['TEST: security sensor unavailable'] %}
            {% endif %}
            {% for entity in states %}
              {% set entity_labels = labels(entity.entity_id) %}
              {% if (label_id('Delayed Security') in entity_labels
                     or label_id('Immediate Security') in entity_labels)
                    and entity.state in ['unavailable', 'unknown'] %}
                {% set ns.reasons = ns.reasons + [entity.name ~ ' ' ~ entity.state] %}
              {% endif %}
            {% endfor %}
            {{ ns.reasons | join('; ') if ns.reasons else 'No trouble' }}

  - binary_sensor:
      - name: Alarm Home Ready
        unique_id: shop_alarm_home_ready
        device_class: running
        state: >-
          {{ is_state('binary_sensor.shop_alarm_system_trouble', 'off') }}
        attributes:
          fault_reason: >-
            {% if is_state('binary_sensor.shop_alarm_system_trouble', 'on') %}
              {{ state_attr('binary_sensor.shop_alarm_system_trouble', 'trouble_reason') }}
            {% else %}
              None
            {% endif %}

      - name: Alarm Away Ready
        unique_id: shop_alarm_away_ready
        device_class: running
        state: >-
          {% set ns = namespace(active=false) %}
          {% for entity in states.binary_sensor %}
            {% set entity_labels = labels(entity.entity_id) %}
            {% if entity.state == 'on'
                  and (label_id('Delayed Security') in entity_labels
                       or label_id('Immediate Security') in entity_labels) %}
              {% set ns.active = true %}
            {% endif %}
          {% endfor %}
          {{ is_state('binary_sensor.shop_alarm_system_trouble', 'off')
             and not ns.active
             and is_state('input_boolean.shop_alarm_test_door_open', 'off') }}
        attributes:
          fault_reason: >-
            {% set ns = namespace(reasons=[]) %}
            {% for entity in states.binary_sensor %}
              {% set entity_labels = labels(entity.entity_id) %}
              {% if entity.state == 'on'
                    and (label_id('Delayed Security') in entity_labels
                         or label_id('Immediate Security') in entity_labels) %}
                {% set ns.reasons = ns.reasons + [entity.name ~ ' is active'] %}
              {% endif %}
            {% endfor %}
            {% if is_state('input_boolean.shop_alarm_test_door_open', 'on') %}
              {% set ns.reasons = ns.reasons + ['Test security sensor is active'] %}
            {% endif %}
            {% if is_state('binary_sensor.shop_alarm_system_trouble', 'on') %}
              {% set ns.reasons = ns.reasons + [state_attr('binary_sensor.shop_alarm_system_trouble', 'trouble_reason')] %}
            {% endif %}
            {{ ns.reasons | join('; ') if ns.reasons else 'None' }}

      - name: Alarm Sleep Ready
        unique_id: shop_alarm_sleep_ready
        device_class: running
        state: >-
          {% set ns = namespace(active=false) %}
          {% for entity in states.binary_sensor %}
            {% set entity_labels = labels(entity.entity_id) %}
            {% if entity.state == 'on'
                  and (label_id('Delayed Security') in entity_labels
                       or label_id('Immediate Security') in entity_labels) %}
              {% set ns.active = true %}
            {% endif %}
          {% endfor %}
          {{ is_state('binary_sensor.shop_alarm_system_trouble', 'off')
             and not ns.active
             and is_state('input_boolean.shop_alarm_test_door_open', 'off') }}
        attributes:
          fault_reason: >-
            {% set ns = namespace(reasons=[]) %}
            {% for entity in states.binary_sensor %}
              {% set entity_labels = labels(entity.entity_id) %}
              {% if entity.state == 'on'
                    and (label_id('Delayed Security') in entity_labels
                         or label_id('Immediate Security') in entity_labels) %}
                {% set ns.reasons = ns.reasons + [entity.name ~ ' is active'] %}
              {% endif %}
            {% endfor %}
            {% if is_state('input_boolean.shop_alarm_test_door_open', 'on') %}
              {% set ns.reasons = ns.reasons + ['Test security sensor is active'] %}
            {% endif %}
            {% if is_state('binary_sensor.shop_alarm_system_trouble', 'on') %}
              {% set ns.reasons = ns.reasons + [state_attr('binary_sensor.shop_alarm_system_trouble', 'trouble_reason')] %}
            {% endif %}
            {{ ns.reasons | join('; ') if ns.reasons else 'None' }}

  - sensor:
      - name: Notification Status
        unique_id: shop_notification_status
        icon: mdi:bell-check
        state: >-
          {% set ns = namespace(names=[]) %}
          {% for entity in states %}
            {% set is_notification = label_id('Notification') in labels(entity.entity_id) %}
            {% set is_problem = (entity.domain == 'binary_sensor' and entity.state == 'on')
                                 or entity.state in ['unavailable', 'unknown'] %}
            {% if is_notification and is_problem %}
              {% set ns.names = ns.names + [entity.name] %}
            {% endif %}
          {% endfor %}
          {% if ns.names | count == 0 %}
            No Active Notifications
          {% else %}
            {{ ns.names | join(', ') }}
          {% endif %}
        attributes:
          active_count: >-
            {% set ns = namespace(count=0) %}
            {% for entity in states %}
              {% set is_notification = label_id('Notification') in labels(entity.entity_id) %}
              {% set is_problem = (entity.domain == 'binary_sensor' and entity.state == 'on')
                                   or entity.state in ['unavailable', 'unknown'] %}
              {% if is_notification and is_problem %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}
          active_entities: >-
            {% set ns = namespace(entities=[]) %}
            {% for entity in states %}
              {% set is_notification = label_id('Notification') in labels(entity.entity_id) %}
              {% set is_problem = (entity.domain == 'binary_sensor' and entity.state == 'on')
                                   or entity.state in ['unavailable', 'unknown'] %}
              {% if is_notification and is_problem %}
                {% set ns.entities = ns.entities + [entity.entity_id] %}
              {% endif %}
            {% endfor %}
            {{ ns.entities }}


      - name: Immediate Security
        unique_id: alarm_immediate_security_status
        icon: mdi:shield-alert
        state: >-
          {% set ns = namespace(names=[]) %}
          {% for entity in states.binary_sensor %}
            {% if entity.state == 'on'
                  and label_id('Immediate Security') in labels(entity.entity_id) %}
              {% set ns.names = ns.names + [entity.name] %}
            {% endif %}
          {% endfor %}
          {{ ns.names | sort | join(', ') if ns.names else 'None Active' }}
        attributes:
          active_count: >-
            {% set ns = namespace(count=0) %}
            {% for entity in states.binary_sensor %}
              {% if entity.state == 'on'
                    and label_id('Immediate Security') in labels(entity.entity_id) %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}
          active_entities: >-
            {% set ns = namespace(entities=[]) %}
            {% for entity in states.binary_sensor %}
              {% if entity.state == 'on'
                    and label_id('Immediate Security') in labels(entity.entity_id) %}
                {% set ns.entities = ns.entities + [entity.entity_id] %}
              {% endif %}
            {% endfor %}
            {{ ns.entities | sort }}

      - name: Delayed Security
        unique_id: alarm_delayed_security_status
        icon: mdi:shield-clock
        state: >-
          {% set ns = namespace(names=[]) %}
          {% for entity in states.binary_sensor %}
            {% if entity.state == 'on'
                  and label_id('Delayed Security') in labels(entity.entity_id) %}
              {% set ns.names = ns.names + [entity.name] %}
            {% endif %}
          {% endfor %}
          {{ ns.names | sort | join(', ') if ns.names else 'None Active' }}
        attributes:
          active_count: >-
            {% set ns = namespace(count=0) %}
            {% for entity in states.binary_sensor %}
              {% if entity.state == 'on'
                    and label_id('Delayed Security') in labels(entity.entity_id) %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}
          active_entities: >-
            {% set ns = namespace(entities=[]) %}
            {% for entity in states.binary_sensor %}
              {% if entity.state == 'on'
                    and label_id('Delayed Security') in labels(entity.entity_id) %}
                {% set ns.entities = ns.entities + [entity.entity_id] %}
              {% endif %}
            {% endfor %}
            {{ ns.entities | sort }}


input_text:

  shop_alarm_notify_action:
    name: Alarm Notify Action
    max: 255
    icon: mdi:cellphone-message

script:
  shop_alarm_send_notification:
    alias: "Alarm - Send Notification"
    description: "Send an audible mobile-app notification when a phone notify action is configured."
    fields:
      title:
        description: "Notification title"
      message:
        description: "Notification message"
    sequence:
      - condition: state
        entity_id: input_boolean.shop_alarm_test_mode
        state: "off"
      - condition: template
        value_template: >-
          {{ states('input_text.shop_alarm_notify_action').startswith('notify.mobile_app_') }}
      - action: "{{ states('input_text.shop_alarm_notify_action') }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            push:
              sound: default
    mode: parallel
    max: 10

  # ---------------------------------------------------------------------------
  # Alarm command API
  #
  # Dashboard cards and tests call the small request/override wrappers below.
  # They all funnel into shop_alarm_arm, which is the single authority for
  # arming transitions.  Changing input_select.shop_alarm_mode by itself does
  # NOT arm or disarm the system.
  # ---------------------------------------------------------------------------

  shop_alarm_set_status:
    alias: "Alarm - Set Status"
    description: "Internal helper: update the displayed target mode and actual alarm state together."
    fields:
      mode:
        description: "Disarmed, Home, Away, or Sleep"
      state:
        description: "Actual Alarm State"
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: "{{ state }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_mode
        data:
          option: "{{ mode }}"
    mode: queued
    max: 10

  shop_alarm_arm:
    alias: "Alarm - Arm"
    description: "Single authoritative arming routine for Home, Away, and Sleep."
    fields:
      requested_mode:
        description: "Home, Away, or Sleep"
      override_fault:
        description: "Allow this one arming cycle despite current readiness faults."
    sequence:
      - variables:
          mode_requested: "{{ requested_mode }}"
          override_requested: "{{ override_fault | default(false) | bool }}"
          current_state: "{{ states('input_select.shop_alarm_state') }}"
          fault_reason: >-
            {% set ns = namespace(reasons=[]) %}
            {% if requested_mode in ['Away', 'Sleep'] %}
              {% for entity in states.binary_sensor %}
                {% set entity_labels = labels(entity.entity_id) %}
                {% if entity.state == 'on'
                      and (label_id('Delayed Security') in entity_labels
                           or label_id('Immediate Security') in entity_labels) %}
                  {% set ns.reasons = ns.reasons + [entity.name ~ ' is active'] %}
                {% endif %}
              {% endfor %}
              {% if is_state('input_boolean.shop_alarm_test_door_open', 'on') %}
                {% set ns.reasons = ns.reasons + ['Test security sensor is active'] %}
              {% endif %}
            {% endif %}
            {% if is_state('binary_sensor.shop_alarm_system_trouble', 'on') %}
              {% set ns.reasons = ns.reasons + [state_attr('binary_sensor.shop_alarm_system_trouble', 'trouble_reason')] %}
            {% endif %}
            {{ ns.reasons | join('; ') }}

      - if:
          - condition: template
            value_template: "{{ mode_requested not in ['Home', 'Away', 'Sleep'] }}"
        then:
          - stop: "Invalid alarm mode request"

      # Only a disarmed system may begin a new arming cycle.
      - if:
          - condition: template
            value_template: "{{ current_state != 'Disarmed' }}"
        then:
          - action: script.shop_alarm_send_notification
            data:
              title: "Alarm"
              message: "Arm {{ mode_requested }} ignored because the system is {{ current_state }}."
          - stop: "Arming request rejected because system is not Disarmed"

      # A normal request with a readiness fault leaves the system truly
      # Disarmed/Disarmed.  The explicit OVERRIDE FAULT buttons call this same
      # routine with override_fault=true.
      - if:
          - condition: template
            value_template: "{{ fault_reason | trim != '' and not override_requested }}"
        then:
          - action: script.shop_alarm_set_status
            data:
              mode: Disarmed
              state: Disarmed
          - action: script.shop_alarm_send_notification
            data:
              title: "Alarm cannot arm normally"
              message: >-
                {{ mode_requested }}: {{ fault_reason }}.
                Correct the problem or use {{ mode_requested | upper }} - OVERRIDE FAULT.
          - stop: "Arming blocked by readiness fault"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_triggered

      # Arming never commands the siren relay.  A relay that disappears after
      # the pre-arm check therefore cannot abort the state-machine transition.
      # Relay commands are reserved for actual alarm/silence operations and
      # use continue_on_error there.

      - if:
          - condition: template
            value_template: "{{ mode_requested == 'Home' }}"
        then:
          - action: script.shop_alarm_set_status
            data:
              mode: Home
              state: Armed Home
          - if:
              - condition: template
                value_template: "{{ override_requested }}"
            then:
              - action: script.shop_alarm_send_notification
                data:
                  title: "ALARM OVERRIDE"
                  message: >-
                    Home arming override accepted.
                    Fault: {{ fault_reason if fault_reason | trim != '' else 'fault was manually overridden' }}.
          - stop: "Home armed"

      # Away and Sleep share the same exit-delay path.
      - action: script.shop_alarm_set_status
        data:
          mode: "{{ mode_requested }}"
          state: Exit Delay

      - if:
          - condition: template
            value_template: "{{ override_requested }}"
        then:
          - action: script.shop_alarm_send_notification
            data:
              title: "ALARM OVERRIDE"
              message: >-
                {{ mode_requested }} arming override accepted.
                Fault: {{ fault_reason if fault_reason | trim != '' else 'fault was manually overridden' }}.

      - action: script.shop_alarm_send_notification
        data:
          title: "Alarm"
          message: "{{ mode_requested }} selected. Exit delay started."

      - delay:
          seconds: >-
            {{ 1 if is_state('input_boolean.shop_alarm_test_mode', 'on') else 30 }}

      # Cancellation/disarming changes the state away from Exit Delay, so this
      # check safely terminates the pending arming cycle.
      - condition: state
        entity_id: input_select.shop_alarm_state
        state: "Exit Delay"

      - if:
          - condition: template
            value_template: "{{ mode_requested == 'Away' }}"
        then:
          - action: script.shop_alarm_set_status
            data:
              mode: Away
              state: Armed Away
        else:
          - action: script.shop_alarm_set_status
            data:
              mode: Sleep
              state: Armed Sleep
    mode: parallel
    max: 4

  shop_alarm_disarm:
    alias: "Alarm - Disarm"
    description: "Authoritative burglary-alarm disarm routine. PIN authorization is handled by the caller/keypad."
    sequence:
      # State/mode are changed first so a slow or failed relay command can
      # never prevent the logical alarm from disarming.
      - action: script.shop_alarm_set_status
        data:
          mode: Disarmed
          state: Disarmed
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_triggered

      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.shop_siren_relay
    mode: restart

  shop_alarm_acknowledge_notifications:
    alias: "Alarm - Acknowledge Notifications"
    description: "Stop repeated critical-alarm notifications until a new alarm event occurs."
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_alarm_notifications_acknowledged
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_notification_active
    mode: restart

  shop_alarm_send_active_alarm_reminder:
    alias: "Alarm - Send Active Alarm Reminder"
    description: "Send one reminder when a critical alarm is active and has not been acknowledged."
    sequence:
      - condition: state
        entity_id: input_boolean.shop_alarm_notifications_acknowledged
        state: "off"
      - condition: template
        value_template: >-
          {{ is_state('input_boolean.shop_alarm_triggered', 'on')
             or is_state('input_boolean.shop_alarm_notification_active', 'on') }}
      - action: script.shop_alarm_send_notification
        data:
          title: "ALARM REMINDER"
          message: >-
            {% set alarms = [] %}
            {% if is_state('input_boolean.shop_alarm_triggered', 'on') %}
              {% set alarms = alarms + ['Burglary alarm'] %}
            {% endif %}
            {% if is_state('input_boolean.shop_alarm_notification_active', 'on') %}
              {% set alarms = alarms + ['Notification condition'] %}
            {% endif %}
            {{ alarms | join(' and ') }} remains active.
            Press Stop Notifications on the Alarm screen to stop reminders.
    mode: single

  shop_alarm_request_home:
    alias: "Alarm - Request Home"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Home
          override_fault: false
    mode: restart

  shop_alarm_request_away:
    alias: "Alarm - Request Away"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Away
          override_fault: false
    mode: restart

  shop_alarm_request_sleep:
    alias: "Alarm - Request Sleep"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Sleep
          override_fault: false
    mode: restart

  shop_alarm_override_home:
    alias: "Alarm - Home Override Fault"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Home
          override_fault: true
    mode: restart

  shop_alarm_override_away:
    alias: "Alarm - Away Override Fault"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Away
          override_fault: true
    mode: restart

  shop_alarm_override_sleep:
    alias: "Alarm - Sleep Override Fault"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Sleep
          override_fault: true
    mode: restart

  shop_alarm_cancel_exit_delay:
    alias: "Alarm - Cancel Exit Delay"
    description: "Cancel Exit Delay and return to Disarmed without requiring a PIN."
    sequence:
      - condition: state
        entity_id: input_select.shop_alarm_state
        state: "Exit Delay"
      - action: script.shop_alarm_disarm
    mode: restart

  # Compatibility name retained for older tests/UI.  It now uses the same
  # authoritative arming routine rather than manipulating helper booleans.
  shop_alarm_arm_away_anyway:
    alias: "Alarm - Arm Away Anyway"
    sequence:
      - action: script.shop_alarm_arm
        data:
          requested_mode: Away
          override_fault: true
    mode: restart



automation:

  - id: shop_alarm_keypad_to_mode
    alias: "Alarm - Keypad Disarm"
    description: "The keypad may disarm the system; dashboard buttons are the only arming commands."
    triggers:
      - trigger: state
        entity_id: alarm_control_panel.shop_alarm_keypad
        to: "disarmed"
    conditions:
      - condition: state
        entity_id: input_boolean.shop_alarm_keypad_sync
        state: "off"
      - condition: template
        value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Disarmed') or not is_state('input_select.shop_alarm_state', 'Disarmed') }}"
    actions:
      - action: script.shop_alarm_disarm
    mode: restart

  - id: shop_alarm_state_to_keypad
    alias: "Alarm - State To Keypad"
    description: "Make the native keypad display follow the authoritative alarm state, not merely the requested mode."
    triggers:
      - trigger: state
        entity_id: input_select.shop_alarm_state
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Disarmed"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'disarmed') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_disarm
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
                data:
                  code: !secret shop_alarm_pin
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Home"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'armed_home') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_arm_home
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Away"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'armed_away') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_arm_away
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Sleep"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'armed_night') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_arm_night
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Fault"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'disarmed') }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
              - action: alarm_control_panel.alarm_disarm
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
                data:
                  code: !secret shop_alarm_pin
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.shop_alarm_keypad_sync
    mode: restart

  - id: shop_alarm_mode_guard
    alias: "Alarm - Mode Guard"
    description: "Keep the mode helper as status only; reject direct mode edits in stable alarm states."
    triggers:
      - trigger: state
        entity_id: input_select.shop_alarm_mode
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Disarmed"
              - condition: template
                value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Disarmed') }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.shop_alarm_mode
                data:
                  option: Disarmed

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Home"
              - condition: template
                value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Home') }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.shop_alarm_mode
                data:
                  option: Home

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Away"
              - condition: template
                value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Away') }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.shop_alarm_mode
                data:
                  option: Away

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_state
                state: "Armed Sleep"
              - condition: template
                value_template: "{{ not is_state('input_select.shop_alarm_mode', 'Sleep') }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.shop_alarm_mode
                data:
                  option: Sleep
    mode: restart

  - id: shop_alarm_door_entry_delay
    alias: "Alarm - Door Entry Delay"
    description: "Start entry delay when any Delayed Security sensor, or the virtual test door, opens while protected."
    triggers:
      # Listen for state changes globally so newly paired/labeled sensors do not
      # require an automation/YAML change or a Home Assistant restart.
      - trigger: event
        event_type: state_changed
        id: real_sensor
      - trigger: state
        entity_id: input_boolean.shop_alarm_test_door_open
        to: "on"
        id: virtual_test
    conditions:
      - condition: template
        value_template: >-
          {{ states('input_select.shop_alarm_state') in ['Armed Home', 'Armed Away', 'Armed Sleep'] }}
      - condition: template
        value_template: >-
          {% if trigger.id == 'virtual_test' %}
            true
          {% else %}
            {% set entity_id = trigger.event.data.entity_id | default('') %}
            {% set old = trigger.event.data.old_state %}
            {% set new = trigger.event.data.new_state %}
            {{ entity_id.startswith('binary_sensor.')
               and old is not none
               and new is not none
               and old.state != 'on'
               and new.state == 'on'
               and label_id('Delayed Security') in labels(entity_id) }}
          {% endif %}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Entry Delay
      - action: script.shop_alarm_send_notification
        data:
          title: "Alarm entry delay"
          message: "Protected door opened. Disarm the alarm."
      - delay:
          seconds: >-
            {{ 1 if is_state('input_boolean.shop_alarm_test_mode', 'on') else 30 }}
      - condition: state
        entity_id: input_select.shop_alarm_state
        state: "Entry Delay"
      # The automation could only start from an armed state, so
      # once Entry Delay expires we do not consult the mutable mode helper.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_alarm_triggered
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_notifications_acknowledged
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Alarm
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.shop_siren_relay
      - action: script.shop_alarm_send_notification
        data:
          title: "ALARM"
          message: "Alarm triggered."
    mode: restart

  - id: shop_alarm_immediate_security
    alias: "Alarm - Immediate Security"
    description: "Trigger the alarm immediately when any Immediate Security sensor becomes active while protected."
    triggers:
      # Listen globally so newly paired/labeled sensors require no YAML change.
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {{ states('input_select.shop_alarm_state') in ['Armed Home', 'Armed Away', 'Armed Sleep'] }}
      - condition: template
        value_template: >-
          {% set entity_id = trigger.event.data.entity_id | default('') %}
          {% set old = trigger.event.data.old_state %}
          {% set new = trigger.event.data.new_state %}
          {{ entity_id.startswith('binary_sensor.')
             and old is not none
             and new is not none
             and old.state != 'on'
             and new.state == 'on'
             and label_id('Immediate Security') in labels(entity_id) }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_alarm_triggered
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_notifications_acknowledged
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Alarm
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.shop_siren_relay
      - action: script.shop_alarm_send_notification
        data:
          title: "ALARM"
          message: "Immediate-security sensor triggered the alarm."
    mode: restart

  - id: shop_alarm_notification_role
    alias: "Alarm - Notification Role"
    description: "Start one latched notification cycle when a Notification-role entity enters an abnormal state."
    triggers:
      # Listen globally so newly paired/labeled entities require no YAML change.
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {% set entity_id = trigger.event.data.entity_id | default('') %}
          {% set old = trigger.event.data.old_state %}
          {% set new = trigger.event.data.new_state %}
          {% if not entity_id or old is none or new is none %}
            false
          {% else %}
            {% set is_notification = label_id('Notification') in labels(entity_id) %}
            {% set domain = entity_id.split('.')[0] %}
            {% set old_problem = (domain == 'binary_sensor' and old.state == 'on')
                                 or old.state in ['unavailable', 'unknown'] %}
            {% set new_problem = (domain == 'binary_sensor' and new.state == 'on')
                                 or new.state in ['unavailable', 'unknown'] %}
            {{ is_notification and (not old_problem) and new_problem }}
          {% endif %}
      # After Stop Notifications, ignore further activations until every
      # Notification-role entity has returned to normal at least once.
      - condition: state
        entity_id: input_boolean.shop_alarm_notifications_acknowledged
        state: "off"
    actions:
      - variables:
          notification_cycle_was_active: >-
            {{ is_state('input_boolean.shop_alarm_notification_active', 'on') }}

      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_alarm_notification_active

      # Only the first abnormal condition of a cycle gets the immediate notification.
      - if:
          - condition: template
            value_template: "{{ not notification_cycle_was_active }}"
        then:
          - action: script.shop_alarm_send_notification
            data:
              title: "Alarm notification"
              message: >-
                {% set entity_id = trigger.event.data.entity_id %}
                {% set friendly = state_attr(entity_id, 'friendly_name')
                                  | default(entity_id, true) %}
                {% set state = trigger.event.data.new_state.state %}
                {% if state in ['unavailable', 'unknown'] %}
                  {{ friendly }} is {{ state }}.
                {% else %}
                  {{ friendly }} became active.
                {% endif %}
    mode: queued
    max: 10

  - id: shop_alarm_notification_rearm
    alias: "Alarm - Notification Rearm"
    description: "Rearm notifications after Stop Notifications once all Notification-role sensors are normal."
    triggers:
      # Any state change can be the one that returns the last active
      # Notification-role sensor to normal.
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: state
        entity_id: input_boolean.shop_alarm_notifications_acknowledged
        state: "on"
      - condition: template
        value_template: >-
          {% set entity_id = trigger.event.data.entity_id | default('') %}
          {% set old = trigger.event.data.old_state %}
          {% set new = trigger.event.data.new_state %}
          {% if not entity_id or old is none or new is none %}
            false
          {% else %}
            {% set is_notification = label_id('Notification') in labels(entity_id) %}
            {% set domain = entity_id.split('.')[0] %}
            {% set old_problem = (domain == 'binary_sensor' and old.state == 'on')
                                 or old.state in ['unavailable', 'unknown'] %}
            {% set new_problem = (domain == 'binary_sensor' and new.state == 'on')
                                 or new.state in ['unavailable', 'unknown'] %}
            {{ is_notification and old_problem and (not new_problem) }}
          {% endif %}
      - condition: template
        value_template: >-
          {% set ns = namespace(any_active=false) %}
          {% for entity in states %}
            {% set is_notification = label_id('Notification') in labels(entity.entity_id) %}
            {% set is_problem = (entity.domain == 'binary_sensor' and entity.state == 'on')
                                 or entity.state in ['unavailable', 'unknown'] %}
            {% if is_notification and is_problem %}
              {% set ns.any_active = true %}
            {% endif %}
          {% endfor %}
          {{ not ns.any_active }}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.shop_alarm_notifications_acknowledged
            - input_boolean.shop_alarm_notification_active
    mode: restart


  - id: shop_alarm_repeat_active_alarm_notification
    alias: "Alarm - Repeat Active Alarm Notification"
    description: "Repeat critical-alarm notifications every two minutes until acknowledged."
    triggers:
      - trigger: time_pattern
        minutes: "/2"
    actions:
      - action: script.shop_alarm_send_active_alarm_reminder
    mode: single

  - id: shop_alarm_siren_trouble_notification
    alias: "Alarm - Siren Trouble Notification"
    description: "Report when the siren relay becomes unavailable or its state becomes unknown."
    triggers:
      - trigger: state
        entity_id: switch.shop_siren_relay
        to: "unavailable"
      - trigger: state
        entity_id: switch.shop_siren_relay
        to: "unknown"
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "ALARM TROUBLE"
          message: >-
            Siren relay is {{ states('switch.shop_siren_relay') }}.
            The alarm system may be unable to sound the siren.
    mode: restart

  - id: shop_alarm_siren_trouble_restored
    alias: "Alarm - Siren Trouble Restored"
    description: "Report when the siren relay returns after a trouble condition."
    triggers:
      - trigger: state
        entity_id: switch.shop_siren_relay
        from: "unavailable"
      - trigger: state
        entity_id: switch.shop_siren_relay
        from: "unknown"
    conditions:
      - condition: template
        value_template: >-
          {{ states('switch.shop_siren_relay') in ['on', 'off'] }}
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "Alarm trouble cleared"
          message: "Siren relay is available again."
    mode: restart

  - id: shop_alarm_security_sensor_trouble_notification
    alias: "Alarm - Security Sensor Trouble Notification"
    description: "Report when any security-role entity becomes unavailable or unknown."
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {% set entity_id = trigger.event.data.entity_id | default('') %}
          {% set old = trigger.event.data.old_state %}
          {% set new = trigger.event.data.new_state %}
          {% if not entity_id or old is none or new is none %}
            false
          {% else %}
            {% set entity_labels = labels(entity_id) %}
            {{ (label_id('Delayed Security') in entity_labels
                or label_id('Immediate Security') in entity_labels)
               and old.state not in ['unavailable', 'unknown']
               and new.state in ['unavailable', 'unknown'] }}
          {% endif %}
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "ALARM TROUBLE"
          message: >-
            {{ state_attr(trigger.event.data.entity_id, 'friendly_name')
               | default(trigger.event.data.entity_id, true) }}
            is {{ trigger.event.data.new_state.state }}.
    mode: queued
    max: 10

  - id: shop_alarm_security_sensor_trouble_restored
    alias: "Alarm - Security Sensor Trouble Restored"
    description: "Report when a security-role entity returns after being unavailable or unknown."
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {% set entity_id = trigger.event.data.entity_id | default('') %}
          {% set old = trigger.event.data.old_state %}
          {% set new = trigger.event.data.new_state %}
          {% if not entity_id or old is none or new is none %}
            false
          {% else %}
            {% set entity_labels = labels(entity_id) %}
            {{ (label_id('Delayed Security') in entity_labels
                or label_id('Immediate Security') in entity_labels)
               and old.state in ['unavailable', 'unknown']
               and new.state not in ['unavailable', 'unknown'] }}
          {% endif %}
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "Alarm trouble cleared"
          message: >-
            {{ state_attr(trigger.event.data.entity_id, 'friendly_name')
               | default(trigger.event.data.entity_id, true) }}
            is available again.
    mode: queued
    max: 10
