# Shop alarm package
#
# Deployment target on Home Assistant OS:
#   /config/packages/shop_alarm.yaml
#
# Alarm modes:
#   Disarmed - no door alarm
#   Home     - user is at the shop; front-door openings are ignored
#   Away     - front door is protected after an exit delay
#   Sleep    - front door is protected immediately
#
# Alarm state tracks the Ring-style progression:
#   Disarmed -> Exit Delay -> Armed Away -> Entry Delay -> Alarm
#
# Away arming fault handling:
#   If the protected front door is open when Away is selected, the alarm
#   enters Fault and waits. Closing the door starts the exit delay.
#   "Shop Alarm - Arm Away Anyway" provides a one-cycle override.
#
# Pytest can enable test mode to shorten delays to one second. Test mode
# also suppresses phone notifications so automated tests do not make noise.

# Native Home Assistant alarm panel.
# The PIN is stored separately in /config/secrets.yaml as shop_alarm_pin.
# The keypad is synchronized with the existing shop_alarm_mode helper below.
# Existing alarm logic remains authoritative for delays, faults, siren,
# water alarm, and system trouble.
alarm_control_panel:
  - platform: manual
    name: Shop Alarm Keypad
    unique_id: shop_alarm_keypad
    code: !secret shop_alarm_pin
    code_arm_required: false
    arming_time: 0
    delay_time: 0
    trigger_time: 0
    arming_states:
      - armed_home
      - armed_away
      - armed_night

input_select:
  shop_alarm_mode:
    name: Shop Alarm Mode
    options:
      - Disarmed
      - Home
      - Away
      - Sleep
    initial: Disarmed
    icon: mdi:shield-home

  shop_alarm_state:
    name: Shop Alarm State
    options:
      - Disarmed
      - Armed Home
      - Exit Delay
      - Armed Away
      - Armed Sleep
      - Entry Delay
      - Fault
      - Alarm
    initial: Disarmed
    icon: mdi:shield-lock

input_boolean:
  shop_alarm_triggered:
    name: Shop Alarm Triggered
    initial: false
    icon: mdi:alarm-light

  shop_alarm_test_door_open:
    name: Shop Alarm Test Door Open
    initial: false
    icon: mdi:door-open

  shop_alarm_test_mode:
    name: Shop Alarm Test Mode
    initial: false
    icon: mdi:test-tube

  shop_alarm_test_siren_unavailable:
    name: Shop Alarm Test Siren Unavailable
    initial: false
    icon: mdi:test-tube

  shop_alarm_test_front_door_unavailable:
    name: Shop Alarm Test Front Door Unavailable
    initial: false
    icon: mdi:test-tube

  shop_alarm_away_override:
    name: Shop Alarm Away Override
    initial: false
    icon: mdi:shield-alert

  shop_water_alarm_enabled:
    name: Shop Water Alarm Enabled
    initial: true
    icon: mdi:water-alert

  shop_water_alarm_active:
    name: Shop Water Alarm Active
    initial: false
    icon: mdi:water-alert

  shop_water_alarm_test_wet:
    name: Shop Water Alarm Test Wet
    initial: false
    icon: mdi:test-tube

template:
  - binary_sensor:
      - name: Shop Alarm System Trouble
        unique_id: shop_alarm_system_trouble
        device_class: problem
        state: >-
          {{ states('switch.shop_siren_relay') in ['unavailable', 'unknown']
             or states('binary_sensor.shop_front_door_opening') in ['unavailable', 'unknown']
             or is_state('input_boolean.shop_alarm_test_siren_unavailable', 'on')
             or is_state('input_boolean.shop_alarm_test_front_door_unavailable', 'on') }}
        attributes:
          trouble_reason: >-
            {% set siren = states('switch.shop_siren_relay') %}
            {% set door = states('binary_sensor.shop_front_door_opening') %}
            {% set test_siren = is_state('input_boolean.shop_alarm_test_siren_unavailable', 'on') %}
            {% set test_door = is_state('input_boolean.shop_alarm_test_front_door_unavailable', 'on') %}
            {% if test_siren and test_door %}
              TEST: siren relay unavailable; front door sensor unavailable
            {% elif test_siren %}
              TEST: siren relay unavailable
            {% elif test_door %}
              TEST: front door sensor unavailable
            {% elif siren in ['unavailable', 'unknown'] and door in ['unavailable', 'unknown'] %}
              Siren relay {{ siren }}; front door sensor {{ door }}
            {% elif siren == 'unavailable' %}
              Siren relay unavailable
            {% elif siren == 'unknown' %}
              Siren relay state unknown
            {% elif door == 'unavailable' %}
              Front door sensor unavailable
            {% elif door == 'unknown' %}
              Front door sensor state unknown
            {% else %}
              None
            {% endif %}

input_text:
  shop_alarm_notify_action:
    name: Shop Alarm Notify Action
    max: 255
    icon: mdi:cellphone-message

script:
  shop_alarm_send_notification:
    alias: "Shop Alarm - Send Notification"
    description: "Send an audible mobile-app notification when a phone notify action is configured."
    fields:
      title:
        description: "Notification title"
      message:
        description: "Notification message"
    sequence:
      - condition: state
        entity_id: input_boolean.shop_alarm_test_mode
        state: "off"
      - condition: template
        value_template: >-
          {{ states('input_text.shop_alarm_notify_action').startswith('notify.mobile_app_') }}
      - action: "{{ states('input_text.shop_alarm_notify_action') }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            push:
              sound: default
    mode: parallel
    max: 10

  shop_alarm_arm_away_anyway:
    alias: "Shop Alarm - Arm Away Anyway"
    description: "Override an open-door Away arming fault for this arming cycle only."
    sequence:
      - condition: state
        entity_id: input_select.shop_alarm_mode
        state: "Away"
      - condition: state
        entity_id: input_select.shop_alarm_state
        state: "Fault"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_alarm_away_override
    mode: single

  shop_water_alarm_enable:
    alias: "Shop Water Alarm - Enable"
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_water_alarm_enabled
      - if:
          - condition: template
            value_template: >-
              {{ is_state('binary_sensor.water_detector', 'on')
                 or is_state('input_boolean.shop_water_alarm_test_wet', 'on') }}
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.shop_water_alarm_active
          - action: switch.turn_on
            target:
              entity_id: switch.shop_siren_relay
          - action: script.shop_alarm_send_notification
            data:
              title: "SHOP WATER ALARM"
              message: "Water alarm enabled while the water sensor is active."

  shop_water_alarm_disable:
    alias: "Shop Water Alarm - Disable"
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.shop_water_alarm_enabled
            - input_boolean.shop_water_alarm_active
      - action: switch.turn_off
        target:
          entity_id: switch.shop_siren_relay


  shop_water_alarm_reset:
    alias: "Shop Water Alarm - Reset"
    description: "Clear a latched water alarm only after both real and virtual water inputs are dry."
    sequence:
      - condition: template
        value_template: >-
          {{ is_state('binary_sensor.water_detector', 'off')
             and is_state('input_boolean.shop_water_alarm_test_wet', 'off') }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_water_alarm_active
      - action: switch.turn_off
        target:
          entity_id: switch.shop_siren_relay
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop water alarm reset"
          message: "Water alarm was reset after the sensor returned to dry."
    mode: single


automation:
  - id: shop_alarm_keypad_to_mode
    alias: "Shop Alarm - Keypad To Mode"
    description: "Translate native alarm-panel keypad selections into the existing shop alarm mode."
    triggers:
      - trigger: state
        entity_id: alarm_control_panel.shop_alarm_keypad
        to: "disarmed"
      - trigger: state
        entity_id: alarm_control_panel.shop_alarm_keypad
        to: "armed_home"
      - trigger: state
        entity_id: alarm_control_panel.shop_alarm_keypad
        to: "armed_away"
      - trigger: state
        entity_id: alarm_control_panel.shop_alarm_keypad
        to: "armed_night"
    actions:
      - variables:
          requested_mode: >-
            {% set map = {
              'disarmed': 'Disarmed',
              'armed_home': 'Home',
              'armed_away': 'Away',
              'armed_night': 'Sleep'
            } %}
            {{ map.get(states('alarm_control_panel.shop_alarm_keypad'), 'Disarmed') }}
      - condition: template
        value_template: >-
          {{ states('input_select.shop_alarm_mode') != requested_mode }}
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_mode
        data:
          option: "{{ requested_mode }}"
    mode: restart

  - id: shop_alarm_mode_to_keypad
    alias: "Shop Alarm - Mode To Keypad"
    description: "Keep the native keypad display synchronized when shop_alarm_mode is changed elsewhere, including pytest."
    triggers:
      - trigger: state
        entity_id: input_select.shop_alarm_mode
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_mode
                state: "Disarmed"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'disarmed') }}
            sequence:
              - action: alarm_control_panel.alarm_disarm
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
                data:
                  code: !secret shop_alarm_pin

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_mode
                state: "Home"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'armed_home') }}
            sequence:
              - action: alarm_control_panel.alarm_arm_home
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_mode
                state: "Away"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'armed_away') }}
            sequence:
              - action: alarm_control_panel.alarm_arm_away
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad

          - conditions:
              - condition: state
                entity_id: input_select.shop_alarm_mode
                state: "Sleep"
              - condition: template
                value_template: >-
                  {{ not is_state('alarm_control_panel.shop_alarm_keypad', 'armed_night') }}
            sequence:
              - action: alarm_control_panel.alarm_arm_night
                target:
                  entity_id: alarm_control_panel.shop_alarm_keypad
    mode: restart

  - id: shop_alarm_mode_disarmed
    alias: "Shop Alarm - Mode Disarmed"
    triggers:
      - trigger: state
        entity_id: input_select.shop_alarm_mode
        to: "Disarmed"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.shop_siren_relay
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.shop_alarm_triggered
            - input_boolean.shop_alarm_away_override
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Disarmed
    mode: restart

  - id: shop_alarm_mode_home
    alias: "Shop Alarm - Mode Home"
    triggers:
      - trigger: state
        entity_id: input_select.shop_alarm_mode
        to: "Home"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.shop_siren_relay
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.shop_alarm_triggered
            - input_boolean.shop_alarm_away_override
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Armed Home
    mode: restart

  - id: shop_alarm_mode_sleep
    alias: "Shop Alarm - Mode Sleep"
    triggers:
      - trigger: state
        entity_id: input_select.shop_alarm_mode
        to: "Sleep"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.shop_siren_relay
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.shop_alarm_triggered
            - input_boolean.shop_alarm_away_override
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Armed Sleep
    mode: restart

  - id: shop_alarm_mode_away
    alias: "Shop Alarm - Mode Away"
    description: "Block Away arming when the protected front door is open unless explicitly overridden."
    triggers:
      - trigger: state
        entity_id: input_select.shop_alarm_mode
        to: "Away"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.shop_siren_relay
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_triggered

      - if:
          - condition: template
            value_template: >-
              {{ is_state('binary_sensor.shop_front_door_opening', 'on')
                 or is_state('input_boolean.shop_alarm_test_door_open', 'on') }}
          - condition: state
            entity_id: input_boolean.shop_alarm_away_override
            state: "off"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.shop_alarm_state
            data:
              option: Fault
          - action: script.shop_alarm_send_notification
            data:
              title: "Shop alarm cannot arm"
              message: "Front door is open. Close it or choose Arm Away Anyway."
          - wait_for_trigger:
              - trigger: state
                entity_id: binary_sensor.shop_front_door_opening
                to: "off"
              - trigger: state
                entity_id: input_boolean.shop_alarm_test_door_open
                to: "off"
              - trigger: state
                entity_id: input_boolean.shop_alarm_away_override
                to: "on"
              - trigger: state
                entity_id: input_select.shop_alarm_mode
                from: "Away"
          - condition: state
            entity_id: input_select.shop_alarm_mode
            state: "Away"
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.shop_alarm_away_override', 'on')
                 or (
                   is_state('binary_sensor.shop_front_door_opening', 'off')
                   and is_state('input_boolean.shop_alarm_test_door_open', 'off')
                 ) }}

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shop_alarm_away_override
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Exit Delay
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop alarm"
          message: "Away selected. Exit delay started."
      - delay:
          seconds: >-
            {{ 1 if is_state('input_boolean.shop_alarm_test_mode', 'on') else 30 }}
      - condition: state
        entity_id: input_select.shop_alarm_mode
        state: "Away"
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Armed Away
    mode: restart

  - id: shop_alarm_door_entry_delay
    alias: "Shop Alarm - Door Entry Delay"
    description: "Start entry delay when the real or virtual door opens while protected."
    triggers:
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        to: "on"
      - trigger: state
        entity_id: input_boolean.shop_alarm_test_door_open
        to: "on"
    conditions:
      - condition: template
        value_template: >-
          {{ states('input_select.shop_alarm_state') in ['Armed Away', 'Armed Sleep'] }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Entry Delay
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop alarm entry delay"
          message: "Protected door opened. Disarm the shop alarm."
      - delay:
          seconds: >-
            {{ 1 if is_state('input_boolean.shop_alarm_test_mode', 'on') else 30 }}
      - condition: state
        entity_id: input_select.shop_alarm_state
        state: "Entry Delay"
      - condition: template
        value_template: >-
          {{ states('input_select.shop_alarm_mode') in ['Away', 'Sleep'] }}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_alarm_triggered
      - action: switch.turn_on
        target:
          entity_id: switch.shop_siren_relay
      - action: input_select.select_option
        target:
          entity_id: input_select.shop_alarm_state
        data:
          option: Alarm
      - action: script.shop_alarm_send_notification
        data:
          title: "SHOP ALARM"
          message: "Alarm triggered at the shop."
    mode: restart

  - id: shop_alarm_siren_trouble_notification
    alias: "Shop Alarm - Siren Trouble Notification"
    description: "Report when the siren relay becomes unavailable or its state becomes unknown."
    triggers:
      - trigger: state
        entity_id: switch.shop_siren_relay
        to: "unavailable"
      - trigger: state
        entity_id: switch.shop_siren_relay
        to: "unknown"
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "SHOP ALARM TROUBLE"
          message: >-
            Siren relay is {{ states('switch.shop_siren_relay') }}.
            The alarm system may be unable to sound the siren.
    mode: restart

  - id: shop_alarm_siren_trouble_restored
    alias: "Shop Alarm - Siren Trouble Restored"
    description: "Report when the siren relay returns after a trouble condition."
    triggers:
      - trigger: state
        entity_id: switch.shop_siren_relay
        from: "unavailable"
      - trigger: state
        entity_id: switch.shop_siren_relay
        from: "unknown"
    conditions:
      - condition: template
        value_template: >-
          {{ states('switch.shop_siren_relay') in ['on', 'off'] }}
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop alarm trouble cleared"
          message: "Siren relay is available again."
    mode: restart

  - id: shop_alarm_front_door_trouble_notification
    alias: "Shop Alarm - Front Door Trouble Notification"
    description: "Report when the front door sensor becomes unavailable or its state becomes unknown."
    triggers:
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        to: "unavailable"
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        to: "unknown"
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "SHOP ALARM TROUBLE"
          message: >-
            Front door sensor is {{ states('binary_sensor.shop_front_door_opening') }}.
            The alarm system may be unable to detect the front door opening.
    mode: restart

  - id: shop_alarm_front_door_trouble_restored
    alias: "Shop Alarm - Front Door Trouble Restored"
    description: "Report when the front door sensor returns after a trouble condition."
    triggers:
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        from: "unavailable"
      - trigger: state
        entity_id: binary_sensor.shop_front_door_opening
        from: "unknown"
    conditions:
      - condition: template
        value_template: >-
          {{ states('binary_sensor.shop_front_door_opening') in ['on', 'off'] }}
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop alarm trouble cleared"
          message: "Front door sensor is available again."
    mode: restart

  - id: shop_water_alarm_trigger
    alias: "Shop Water Alarm - Trigger"
    description: "Trigger immediately when water contact closes while the water alarm is enabled."
    triggers:
      - trigger: state
        entity_id: binary_sensor.water_detector
        to: "on"
      - trigger: state
        entity_id: input_boolean.shop_water_alarm_test_wet
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.shop_water_alarm_enabled
        state: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shop_water_alarm_active
      - action: switch.turn_on
        target:
          entity_id: switch.shop_siren_relay
      - action: script.shop_alarm_send_notification
        data:
          title: "SHOP WATER ALARM"
          message: "Water detected at the shop."
    mode: restart

  - id: shop_water_alarm_sensor_dry
    alias: "Shop Water Alarm - Sensor Dry"
    description: "Report that the sensor is dry, but keep an active water alarm latched until reset."
    triggers:
      - trigger: state
        entity_id: binary_sensor.water_detector
        to: "off"
      - trigger: state
        entity_id: input_boolean.shop_water_alarm_test_wet
        to: "off"
    conditions:
      - condition: template
        value_template: >-
          {{ is_state('binary_sensor.water_detector', 'off')
             and is_state('input_boolean.shop_water_alarm_test_wet', 'off') }}
      - condition: state
        entity_id: input_boolean.shop_water_alarm_active
        state: "on"
    actions:
      - action: script.shop_alarm_send_notification
        data:
          title: "Shop water sensor dry"
          message: "Water sensor returned to dry. Water alarm remains latched until reset."
    mode: restart

